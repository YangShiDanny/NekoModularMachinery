name: Sync Wiki

on:
  push:
    branches: [main, master]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Push wiki/ to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.wiki.git"
          SRC="${{ github.workspace }}/wiki"

          cd "$(mktemp -d)"

          if ! git clone --depth 1 "$WIKI_URL" wiki-repo 2>/dev/null; then
            echo "::warning::Wiki repository does not exist yet."
            echo "::warning::Open https://github.com/${REPO}/wiki and click 'Create the first page' once, then re-run this workflow."
            # Exit 0 on purpose: a missing wiki must not fail the whole build.
            exit 0
          fi

          cd wiki-repo
          # Drop stale pages, then copy the source of truth over.
          find . -maxdepth 1 -name '*.md' -delete
          cp "$SRC"/*.md .

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "docs: sync wiki from ${GITHUB_SHA::7}"
            git push
            echo "Wiki synced."
          else
            echo "Wiki already up to date."
          fi
