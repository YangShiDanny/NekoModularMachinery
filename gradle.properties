# ---- mod metadata ----------------------------------------------------------
mod_version=0.1.0
mod_id=mmcr_nekojs
mod_name=MMCR NekoJS Bridge
mod_group=cn.howxu
mod_license=MIT

# ---- Gradle ---------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# GitHub Actions' setup-java exposes both JDKs as JAVA_HOME_<n>_X64; pointing Gradle at
# them avoids a second ~200 MB download through the Foojay resolver on every build.
# These variables do not exist locally, in which case Gradle simply ignores them and the
# resolver fetches whatever toolchain is missing.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
